<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">Social links profile</h1>
    <article class="profile">
      <img src="./images/avatar.jpg" alt="Asyalapa's avatar" class="profile-avatar">
      <div class="profile-main-info">
        <h2 class="profile-name">Anastasia Asyalapa</h2>
        <p class="profile-location">Nizhny Novgorod, Russia</p>
      </div>
      <p class="profile-description">
        "Front-end developer and avid reader."
      </p>
      <ul class="profile-links">
        <li class="profile-link">
          <a href="https://github.com/Asyalapa" target="_blank" class="link">GitHub</a>
        </li>
        <li class="profile-link">
          <a href="https://www.frontendmentor.io/profile/Asyalapa" target="_blank" class="link">Frontend Mentor</a>
        </li>
        <li class="profile-link">
          <a href="https://www.linkedin.com/in/asyalapa/" target="_blank" class="link">LinkedIn</a>
        </li>
        <li class="profile-link">
          <a href="https://x.com/Asyalapa" target="_blank" class="link">X</a>
        </li>
        <li class="profile-link">
          <a href="https://www.instagram.com/asyalapa.ph/" target="_blank" class="link">Instagram</a>
        </li>
      </ul>
    </article>
  </main>

  <footer class="footer">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Asyalapa" target="_blank">Asyalapa</a>.
  </footer>
</body>
</html>
