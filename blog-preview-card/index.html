<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">Blog preview card</h1>
    <article class="card">
      <div class="image-box">
      </div>
      <div class="text-box">
        <button class="tag-btn">Learning</button>
        <p class="card-date">Published 21 Dec 2023</p>
        <h2 class="card-title">HTML & CSS foundations</h2>
        <p class="card-info">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="autor-box">
        <img src="./images/image-avatar.webp" alt="Greg Hooper's avatar" class="autor-avatar">
        <h3 class="autor-name">Greg Hooper</h3>
      </div>
    </article>
  </main>

  <footer class="footer">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Asyalapa" target="_blank">Asyalapa</a>.
  </footer>
</body>
</html>
